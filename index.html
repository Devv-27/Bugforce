<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BugForge – Issue Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#faf7f0;--ink:#1c1a17;--mut:#77706a;--line:#ece6d8;--gold:#c8962e;--gold2:#a47818;--soft:#f4eedf;--red:#d64545;--grn:#2e9e6b;box-sizing:border-box}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:Sora,Inter,sans-serif;font-weight:600;letter-spacing:-.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.mut,small{color:var(--mut)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select,textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,150,46,.2)}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;padding:12px 28px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font:600 18px Sora,sans-serif;color:var(--ink)}
.mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#e6bb5a,#b48220);color:#fff;display:grid;place-items:center;font:700 16px Sora,sans-serif}
.t2{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:999px}
.t2 button{background:none;border:0;padding:7px 16px;border-radius:999px;color:var(--mut);font-weight:500;white-space:nowrap}
.t2 button:hover{color:var(--ink)}.t2 button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(60,40,5,.15)}
.sbox{margin-left:auto;flex:1;max-width:300px;min-width:180px;display:flex;align-items:center;background:var(--soft);border-radius:999px;padding:0 6px 0 16px}
.sbox input,.sbox input:focus{border:0;background:none;box-shadow:none;padding:9px 0}
.sbox button{border:0;background:none;display:grid;place-items:center;padding:6px}
.psel{width:auto;max-width:200px;border-radius:999px;padding:8px 14px}
.user{display:flex;gap:10px;align-items:center}.user div{display:flex;flex-direction:column;line-height:1.15}.user small{font-size:11px}
.av{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--gold2);display:inline-grid;place-items:center;font:700 11px Sora,sans-serif;border:1px solid #e6d9b4;flex:none}
.lnk{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px}.lnk:hover{border-color:var(--gold)}
.page{max-width:1240px;margin:0 auto;padding:28px 28px 60px;min-height:calc(100vh - 62px)}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:22px}.ph h1{font-size:30px}
.abtn,.btn{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:10px 20px;font-weight:600;transition:background .15s}
.abtn:hover,.btn:hover{background:var(--gold2)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.ghost:hover{border-color:var(--gold);background:#fff}
.btn.danger{background:#fff;color:var(--red);border:1px solid #f1c9c9}.btn.danger:hover{background:#fdf0f0}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(60,40,5,.04),0 8px 24px rgba(60,40,5,.04)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:16px}
.stat{position:relative;overflow:hidden}.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}
.stat b{display:block;font:600 34px Sora,sans-serif}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.bar{display:flex;align-items:center;gap:10px;margin:12px 0}.bar span{width:70px}.bar i{display:block;height:8px;border-radius:6px;background:linear-gradient(90deg,#e6bb5a,#b48220)}
.fb{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}.fb input{flex:1 1 220px;width:auto}.fb select{width:auto;flex:0 1 160px}
.board{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:16px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--soft);border:1px solid transparent;border-radius:16px;padding:12px;min-height:260px}
.col.over{border-color:var(--gold);background:#f6ecd2}
.col h3{display:flex;align-items:center;gap:8px;margin:2px 4px 12px;font-size:14px}
.col h3::before{content:"";width:9px;height:9px;border-radius:50%;background:#9a948b}
.col[data-col=prog] h3::before{background:var(--gold)}.col[data-col=done] h3::before{background:var(--grn)}
.col h3 em{margin-left:auto;font:500 12px Inter,sans-serif;background:#fff;border-radius:999px;padding:1px 9px;color:var(--mut)}
.tk{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px;cursor:grab;box-shadow:0 1px 2px rgba(60,40,5,.05);transition:box-shadow .15s,transform .15s}
.tk:hover{box-shadow:0 8px 20px rgba(60,40,5,.12);transform:translateY(-1px)}
.tk p{margin:6px 0 12px;font-weight:600;line-height:1.35}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.tag{font-size:11px;font-weight:600;border-radius:999px;padding:2px 10px;background:#eceae4;color:#6b655d}
.tag.Medium{background:#e4eefa;color:#2b64a8}.tag.High{background:#fdecd2;color:#a95e07}.tag.Critical{background:#fbe0e0;color:#b32d2d}
.mv{background:#fff;border:1px solid var(--line);border-radius:8px;width:26px;height:26px;padding:0;color:var(--mut)}.mv:hover{border-color:var(--gold);color:var(--ink)}
.wrap{overflow-x:auto}.tbl{width:100%;border-collapse:collapse}.tbl td,.tbl th{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line)}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:600}.tbl tr[data-act]{cursor:pointer}.tbl tr[data-act]:hover{background:var(--bg)}
.ov{display:block}
.md{max-width:780px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 8px 24px rgba(60,40,5,.05)}
.md h2{font-size:24px;margin-bottom:14px}
.back{background:none;border:0;padding:0;margin-bottom:10px;color:var(--gold2);font-weight:600}.back:hover{text-decoration:underline}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.f label{font-size:12px;font-weight:600;color:var(--mut)}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.cm{background:var(--bg);border-radius:10px;padding:10px 12px;margin:8px 0}
.shot{max-width:100%;max-height:180px;border-radius:10px;border:1px solid var(--line);margin-top:6px}
.empty{text-align:center;padding:48px;color:var(--mut)}.err{color:var(--red);min-height:18px;font-size:13px}
.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.auth{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh}
.hero{background:radial-gradient(600px 420px at 15% 0,rgba(230,187,90,.45) 0,transparent 65%),linear-gradient(160deg,#1c1a17,#2c2416);color:#fff;padding:44px 48px;display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.hero .brand{color:#fff}.hero h1{font-size:42px;line-height:1.1;max-width:430px;margin-bottom:14px}.hero p{color:#d9cfb8;max-width:380px;margin:0}
.hero ul{list-style:none;padding:0;margin:24px 0 0;display:grid;gap:10px;color:#eadfc4}.hero li::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:10px}
.formside{display:grid;place-items:center;padding:32px;background:#fff}
.ac{width:100%;max-width:380px}.ft{font-size:28px}
.tabs{display:flex;background:var(--soft);border-radius:999px;padding:4px;margin:18px 0}.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:999px;color:var(--mut)}.tabs .on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(60,40,5,.15)}
.ac .btn{width:100%}.demo{display:flex;gap:8px;margin-top:14px}.demo button{flex:1;padding:8px}
@media(max-width:820px){.auth{grid-template-columns:1fr}.hero{padding:26px 22px}.hero h1{font-size:28px}.g{grid-template-columns:1fr}.top{flex-wrap:wrap;gap:10px;padding:10px 14px}.t2{order:5;width:100%;overflow-x:auto}.sbox{order:4;max-width:none;flex-basis:100%}.user div{display:none}.page{padding:18px 14px 40px}}
.lnk,.user,.brand,.abtn,.btn{white-space:nowrap}.top{gap:12px}.sbox{min-width:140px;max-width:260px}.psel{max-width:180px;text-overflow:ellipsis}
.bar{display:grid;grid-template-columns:70px 1fr 24px}
/* ===== Neon green on black ===== */
:root{color-scheme:dark;--bg:#030504;--ink:#e8fff1;--mut:#7aa38b;--line:#16301f;--gold:#00ff88;--gold2:#00d46f;--soft:#0a110d;--neon:#00ff88;--panel:#0a110d;--panel2:#0f1a14}
*{scrollbar-color:#00ff88 #0a110d}
body{background:radial-gradient(900px 500px at 85% -10%,rgba(0,255,136,.10),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(0,120,60,.14),transparent 55%),#030504;color:var(--ink)}
.ph h1{text-shadow:0 0 24px rgba(0,255,136,.35)}
input,select,textarea{background:#060b08;border-color:var(--line);color:var(--ink)}
input::placeholder,textarea::placeholder{color:#4f7561}
input:focus,select:focus,textarea:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(0,255,136,.18),0 0 16px rgba(0,255,136,.25)}
.top{background:rgba(3,5,4,.88);border-bottom:1px solid #123a24;box-shadow:0 1px 22px rgba(0,255,136,.12)}
.mark{background:linear-gradient(135deg,#39ffa0,#00c864);color:#021208;box-shadow:0 0 16px rgba(0,255,136,.6)}
.t2{background:var(--panel);border:1px solid var(--line)}
.t2 button.on{background:#0f2a1b;color:var(--neon);box-shadow:0 0 14px rgba(0,255,136,.3),inset 0 0 0 1px rgba(0,255,136,.5)}
.sbox{background:var(--panel);border:1px solid var(--line)}.sbox svg{stroke:#00ff88}
.sbox input,.sbox input:focus{background:none;border:0;box-shadow:none}
.av{background:#0f2a1b;color:var(--neon);border-color:#1d5a37}
.lnk{color:var(--ink);border-color:var(--line)}.lnk:hover{border-color:var(--neon);box-shadow:0 0 12px rgba(0,255,136,.3)}
.abtn,.btn{background:var(--neon);color:#021208;box-shadow:0 0 18px rgba(0,255,136,.45)}
.abtn:hover,.btn:hover{background:#4dffab;box-shadow:0 0 28px rgba(0,255,136,.7)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid #1d5a37;box-shadow:none}.btn.ghost:hover{background:#0f1a14;border-color:var(--neon);box-shadow:0 0 14px rgba(0,255,136,.3)}
.btn.danger{background:transparent;color:#ff6b7d;border:1px solid rgba(255,70,90,.45);box-shadow:none}.btn.danger:hover{background:rgba(255,70,90,.1)}
.card,.md{background:var(--panel);border-color:var(--line);box-shadow:0 10px 30px rgba(0,0,0,.55),0 0 0 1px rgba(0,255,136,.03)}
.stat::before{background:var(--neon);box-shadow:0 0 12px var(--neon)}
.stat b{color:var(--neon);text-shadow:0 0 18px rgba(0,255,136,.6)}
.bar i{background:linear-gradient(90deg,#00a85a,#00ff88);box-shadow:0 0 12px rgba(0,255,136,.6)}
.col{background:#08110c;border-color:#0f2417}
.col.over{border-color:var(--neon);background:#0b1f14;box-shadow:0 0 24px rgba(0,255,136,.3)}
.col h3::before{background:#4d7a62}.col[data-col=prog] h3::before{background:#c6ff3d;box-shadow:0 0 10px #c6ff3d}.col[data-col=done] h3::before{background:var(--neon);box-shadow:0 0 10px var(--neon)}
.col h3 em{background:var(--panel2);color:var(--mut)}
.tk{background:var(--panel);border-color:var(--line);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.tk:hover{border-color:var(--neon);box-shadow:0 0 20px rgba(0,255,136,.3)}
.tag{background:var(--panel2);color:var(--mut)}
.tag.Medium{background:rgba(80,160,255,.14);color:#7db8ff}.tag.High{background:rgba(255,170,40,.14);color:#ffb347}.tag.Critical{background:rgba(255,70,90,.16);color:#ff6b7d;box-shadow:0 0 10px rgba(255,70,90,.3)}
.mv{background:var(--panel);border-color:var(--line);color:var(--mut)}.mv:hover{border-color:var(--neon);color:var(--neon)}
.tbl tr[data-act]:hover{background:var(--panel2)}
.back{color:var(--neon)}.cm{background:var(--panel2)}
.err{color:#ff6b7d}
.toast{background:var(--panel);color:var(--neon);border:1px solid var(--neon);box-shadow:0 0 24px rgba(0,255,136,.4)}
.hero{background:radial-gradient(620px 440px at 15% 0,rgba(0,255,136,.28) 0,transparent 65%),radial-gradient(500px 400px at 100% 100%,rgba(0,140,70,.25) 0,transparent 60%),#020403}
.hero h1{text-shadow:0 0 30px rgba(0,255,136,.45)}.hero p,.hero ul{color:#b8e6cb}
.hero li::before{background:var(--neon);box-shadow:0 0 10px var(--neon)}
.formside{background:#030504}
.tabs{background:var(--panel);border:1px solid var(--line)}.tabs .on{background:#0f2a1b;color:var(--neon);box-shadow:inset 0 0 0 1px rgba(0,255,136,.5),0 0 12px rgba(0,255,136,.25)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST=[['todo','To Do'],['prog','In Progress'],['done','Done']],PR=['Low','Medium','High','Critical'],TY=['Bug','Task','Story'],ROLES=['Admin','Manager','Developer'];
const KEY='bugforge_db_v1',SK='bugforge_session';
let db,me=null,view='board',pid=null,filt={q:'',st:'',pr:'',as:''},modal=null,mode='login',aerr='',dragId=null,minm=false,maxm=false,wp={};
const uid=()=>Math.random().toString(36).slice(2,10);
async function hash(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('bf:'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa('bf:'+p)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Storage is full. Remove a screenshot.')}}
async function seed(){
 const mk=async(n,e,p,r)=>({id:uid(),name:n,email:e,pw:await hash(p),role:r});
 const a=await mk('Ava Admin','admin@demo.com','admin123','Admin'),m=await mk('Maya Manager','manager@demo.com','manager123','Manager'),d=await mk('Dev Patel','dev@demo.com','dev123','Developer');
 const p={id:uid(),key:'PHX',name:'Phoenix Platform',desc:'Core platform rewrite',owner:m.id,members:[m.id,d.id],seq:1};
 const iss=[['Login fails with special characters in password','Bug','Critical','prog',d.id],['Add dark mode toggle to settings','Story','Medium','todo',d.id],['Dashboard chart flickers on resize','Bug','High','todo',null],['Set up CI pipeline','Task','Low','done',m.id],['Upload screenshot is slow on mobile','Bug','Medium','prog',d.id]]
 .map(x=>({id:uid(),pid:p.id,num:p.seq++,title:x[0],desc:'Steps to reproduce and notes go here.',type:x[1],pr:x[2],st:x[3],as:x[4],rep:m.id,shot:'',cm:[],at:Date.now()}));
 db={users:[a,m,d],projects:[p],issues:iss};save();
}
async function load(){try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!db)await seed();
 try{const s=localStorage.getItem(SK);if(s)me=db.users.find(u=>u.id===s)||null}catch(e){}
 const ps=myProjects();pid=ps[0]?ps[0].id:null;render()}
const usr=id=>db.users.find(u=>u.id===id);
const ini=n=>String(n).split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
const myProjects=()=>me?db.projects.filter(p=>me.role==='Admin'||p.members.includes(me.id)):[];
const cur=()=>myProjects().find(p=>p.id===pid)||null;
const isAdm=()=>me.role==='Admin',canMk=()=>me.role!=='Developer';
const canMgr=p=>isAdm()||p.owner===me.id||(me.role==='Manager'&&p.members.includes(me.id));
const canEd=(i,p)=>canMgr(p)||i.rep===me.id||i.as===me.id;
const canDel=(i,p)=>canMgr(p)||i.rep===me.id;
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2300)}
const av=id=>{const u=usr(id);return u?`<span class="av" title="${esc(u.name)}">${ini(u.name)}</span>`:'<span class="av" style="background:#0f1a14;color:#5f8a73" title="Unassigned">?</span>'};
function filtered(p){const q=filt.q.toLowerCase();return db.issues.filter(i=>i.pid===p.id&&(!q||(p.key+'-'+i.num+' '+i.title+' '+i.desc).toLowerCase().includes(q))&&(!filt.st||i.st===filt.st)&&(!filt.pr||i.pr===filt.pr)&&(!filt.as||(filt.as==='none'?!i.as:i.as===filt.as)))}
function authHTML(){const reg=mode==='reg';
 return`<div class="auth"><div class="hero"><div class="brand"><span class="mark">B</span>BugForge</div><div><h1>Track every bug. Ship with confidence.</h1><p>One calm place for your team to plan, assign and close issues.</p><ul><li>Kanban board with drag and drop</li><li>Roles for admins, managers and developers</li><li>Comments, search and filters</li></ul></div><small style="color:#6f9a82">Demo data is saved in this browser only.</small></div><div class="formside"><form class="ac" data-form="auth"><h2 class="ft">${reg?'Create your account':'Welcome back'}</h2><p class="mut" style="margin:4px 0 0">${reg?'Pick a role to get started.':'Sign in to your workspace.'}</p>
 <div class="tabs"><button type="button" data-act="mode" data-v="login" class="${reg?'':'on'}">Sign in</button><button type="button" data-act="mode" data-v="reg" class="${reg?'on':''}">Create account</button></div>
 ${reg?'<div class="f"><label>Full name</label><input name="name" required></div>':''}
 <div class="f"><label>Email</label><input name="email" type="email" required></div>
 <div class="f"><label>Password</label><input name="pw" type="password" minlength="6" required></div>
 ${reg?`<div class="f"><label>Role</label><select name="role">${ROLES.map(r=>`<option>${r}</option>`).join('')}</select></div>`:''}
 <div class="err">${esc(aerr)}</div><button class="btn" style="width:100%">${reg?'Create account':'Sign in'}</button>
 <div class="demo"><button type="button" class="btn ghost" data-act="demo" data-e="admin@demo.com" data-p="admin123">Admin</button><button type="button" class="btn ghost" data-act="demo" data-e="manager@demo.com" data-p="manager123">Manager</button><button type="button" class="btn ghost" data-act="demo" data-e="dev@demo.com" data-p="dev123">Developer</button></div>
 <p class="mut" style="text-align:center;font-size:12px">Tap a role to try the demo instantly</p></form></div></div>`}
const titles={dash:'Dashboard',board:'Kanban board',list:'All issues',team:'Team'};
function shell(){const p=cur(),ps=myProjects();
 return`<header class="top"><button class="brand" data-act="nav" data-v="board"><span class="mark">B</span>BugForge</button>
 <nav class="t2">${[['dash','Dashboard'],['board','Board'],['list','All issues'],['team','Team']].map(([k,l])=>`<button class="${view===k?'on':''}" data-act="nav" data-v="${k}">${l}</button>`).join('')}</nav>
 <div class="sbox"><input id="gq" placeholder="Search issues" value="${esc(filt.q)}"><button data-act="gsearch" aria-label="Search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#77706a" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button></div>
 <select class="psel" id="psel" aria-label="Project">${ps.map(x=>`<option value="${x.id}" ${p&&x.id===p.id?'selected':''}>${esc(x.key)} - ${esc(x.name)}</option>`).join('')||'<option>No projects</option>'}</select>
 ${canMk()?'<button class="lnk" data-act="newproj">+ Project</button>':''}
 <div class="user"><span class="av">${ini(me.name)}</span><div><b>${esc(me.name)}</b><small>${me.role}</small></div></div><button class="lnk" data-act="logout">Sign out</button></header>
 <div class="page"><div class="ph"><div><h1>${titles[view]}</h1><p class="mut" style="margin:4px 0 0">${p?esc(p.name)+' ('+esc(p.key)+')':'Create a project to begin'}</p></div>${p?'<button class="abtn" data-act="newissue">+ New issue</button>':''}</div><section id="main">${modal&&modal.t!=='none'?modalHTML():mainHTML()}</section></div>`}
function mainHTML(){const p=cur();
 if(!p)return`<div class="card empty"><h2>No project yet</h2><p>${canMk()?'Create your first project to start tracking issues.':'Ask a manager to add you to a project.'}</p>${canMk()?'<button class="btn" data-act="newproj">Create project</button>':''}</div>`;
 if(view==='dash')return dash(p);if(view==='team')return team(p);
 return`<div class="fb"><input id="fq" placeholder="Search issues…" value="${esc(filt.q)}">
 <select data-f="st"><option value="">All status</option>${ST.map(s=>`<option value="${s[0]}" ${filt.st===s[0]?'selected':''}>${s[1]}</option>`).join('')}</select>
 <select data-f="pr"><option value="">All priority</option>${PR.map(s=>`<option ${filt.pr===s?'selected':''}>${s}</option>`).join('')}</select>
 <select data-f="as"><option value="">Anyone</option><option value="none" ${filt.as==='none'?'selected':''}>Unassigned</option>${p.members.map(m=>usr(m)).filter(Boolean).map(u=>`<option value="${u.id}" ${filt.as===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div><div id="res">${res(p)}</div>`}
function res(p){const l=filtered(p);return view==='list'?listH(p,l):boardH(p,l)}
function card(i,p){return`<div class="tk ${i.pr}" draggable="true" data-id="${i.id}" data-act="open"><div class="row"><small>${esc(p.key)}-${i.num} · ${i.type}</small><span class="tag ${i.pr}">${i.pr}</span></div><p>${esc(i.title)}</p><div class="row"><span>${av(i.as)} <small>${i.cm.length?'💬 '+i.cm.length:''}</small></span><span><button class="mv" data-act="mv" data-id="${i.id}" data-d="-1" title="Move back">‹</button> <button class="mv" data-act="mv" data-id="${i.id}" data-d="1" title="Move forward">›</button></span></div></div>`}
function boardH(p,l){return`<div class="board">${ST.map(([k,n])=>{const c=l.filter(i=>i.st===k);return`<div class="col" data-col="${k}"><h3>${n} <em>${c.length}</em></h3>${c.map(i=>card(i,p)).join('')||'<p class="mut" style="text-align:center">Drop issues here</p>'}</div>`}).join('')}</div>`}
function listH(p,l){return l.length?`<div class="card wrap"><table class="tbl"><tr><th>Key</th><th>Title</th><th>Type</th><th>Priority</th><th>Status</th><th>Assignee</th></tr>${l.map(i=>`<tr data-act="open" data-id="${i.id}"><td>${esc(p.key)}-${i.num}</td><td>${esc(i.title)}</td><td>${i.type}</td><td><span class="tag ${i.pr}">${i.pr}</span></td><td>${ST.find(s=>s[0]===i.st)[1]}</td><td>${av(i.as)}</td></tr>`).join('')}</table></div>`:'<div class="card empty">No issues match these filters.</div>'}
function dash(p){const l=db.issues.filter(i=>i.pid===p.id),n=k=>l.filter(i=>i.st===k).length,mx=Math.max(1,...PR.map(r=>l.filter(i=>i.pr===r).length));
 return`<div class="stats">${[['Total',l.length],['To Do',n('todo')],['In Progress',n('prog')],['Done',n('done')],['Assigned to me',l.filter(i=>i.as===me.id&&i.st!=='done').length]].map(s=>`<div class="card stat"><small>${s[0]}</small><b>${s[1]}</b></div>`).join('')}</div>
 <div class="two"><div class="card"><h3>Issues by priority</h3>${PR.map(r=>{const c=l.filter(i=>i.pr===r).length;return`<div class="bar"><span>${r}</span><i style="width:${c/mx*100}%;min-width:6px"></i><small>${c}</small></div>`}).join('')}</div>
 <div class="card"><h3 style="margin-bottom:8px">Recent issues</h3>${l.slice().sort((a,b)=>b.at-a.at).slice(0,5).map(i=>`<div class="row" style="padding:7px 0;cursor:pointer" data-act="open" data-id="${i.id}"><span>${esc(i.title)}</span><span class="tag ${i.pr}">${i.pr}</span></div>`).join('')||'<p class="mut">Nothing yet</p>'}</div></div>`}
function team(p){const m=canMgr(p),out=db.users.filter(u=>!p.members.includes(u.id));
 return`<div class="card"><h3>${esc(p.name)} <small>(${esc(p.key)})</small></h3><p class="mut">${esc(p.desc)}</p>
 ${p.members.map(usr).filter(Boolean).map(u=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)"><span class="row" style="justify-content:flex-start">${av(u.id)}<span><b>${esc(u.name)}</b><br><small>${esc(u.email)}</small></span></span><span class="row"><span class="tag">${u.role}</span>${m&&u.id!==p.owner?`<button class="btn ghost" data-act="rmm" data-id="${u.id}">Remove</button>`:''}</span></div>`).join('')}
 ${m?`<form data-form="addm" class="row" style="margin-top:14px"><select name="u" required><option value="">Add a member…</option>${out.map(u=>`<option value="${u.id}">${esc(u.name)} (${u.role})</option>`).join('')}</select><button class="btn">Add</button></form>
 <div class="acts"><button class="btn danger" data-act="delproj">${modal&&modal.dp?'Click again to delete project':'Delete project'}</button></div>`:'<p class="mut" style="margin-top:12px">Only admins and managers can change the team.</p>'}</div>`}
function modalHTML(){
 if(modal.t==='proj')return`<div class="ov"><form class="md" data-form="proj"><h2>New project</h2><div class="g"><div class="f"><label>Name</label><input name="name" required></div><div class="f"><label>Key (3–5 letters)</label><input name="key" maxlength="5" minlength="2" required></div></div><div class="f"><label>Description</label><textarea name="desc" rows="3"></textarea></div><div class="acts"><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn">Create project</button></div></form></div>`;
 const p=cur(),i=modal.id?db.issues.find(x=>x.id===modal.id):null,ro=i&&!canEd(i,p),d=ro?'disabled':'';
 const v=i||{title:'',desc:'',type:'Bug',pr:'Medium',st:modal.st||'todo',as:null,shot:'',cm:[]};
 const o=(a,s)=>a.map(x=>`<option ${x===s?'selected':''}>${x}</option>`).join('');
 return`<div class="ov"><div class="md"><h2>${i?esc(p.key)+'-'+i.num:'New issue'}</h2><form data-form="issue"><div class="f"><label>Title</label><input name="title" required value="${esc(v.title)}" ${d}></div>
 <div class="f"><label>Description</label><textarea name="desc" rows="3" ${d}>${esc(v.desc)}</textarea></div>
 <div class="g"><div class="f"><label>Type</label><select name="type" ${d}>${o(TY,v.type)}</select></div><div class="f"><label>Priority</label><select name="pr" ${d}>${o(PR,v.pr)}</select></div>
 <div class="f"><label>Status</label><select name="st" ${d}>${ST.map(s=>`<option value="${s[0]}" ${s[0]===v.st?'selected':''}>${s[1]}</option>`).join('')}</select></div>
 <div class="f"><label>Assignee</label><select name="as" ${d}><option value="">Unassigned</option>${p.members.map(usr).filter(Boolean).map(u=>`<option value="${u.id}" ${u.id===v.as?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div></div>
 <div class="f"><label>Screenshot (optional)</label>${ro?'':'<input type="file" id="shotf" accept="image/*">'}<div id="shotprev">${v.shot?`<img class="shot" src="${v.shot}" alt="Screenshot">`:''}</div></div>
 <div class="acts"><button type="button" class="btn ghost" data-act="close">${ro?'Close':'Cancel'}</button>${i&&canDel(i,p)?`<button type="button" class="btn danger" data-act="delissue">${modal.dc?'Click again to delete':'Delete'}</button>`:''}${ro?'':`<button class="btn">${i?'Save changes':'Create issue'}</button>`}</div></form>
 ${i?`<h3 style="margin-top:18px">Comments (${i.cm.length})</h3>${i.cm.map(c=>`<div class="cm"><small><b>${esc((usr(c.by)||{name:'Former user'}).name)}</b> · ${new Date(c.at).toLocaleString()}</small><div>${esc(c.tx)}</div></div>`).join('')||'<p class="mut">No comments yet.</p>'}<form data-form="cmt" class="row" style="margin-top:10px"><input name="tx" placeholder="Write a comment…" required><button class="btn">Post</button></form>`:''}</div></div>`}
function render(){const a=$('#app');a.innerHTML=me?shell():authHTML();deco()}
function openModal(m){modal=m;wp.md=null;render()}
function mbar(){return'<div class="mbar"><b style="color:var(--pink)">◆ BugForge</b><span>Issue Tracker</span><span style="margin-left:auto" id="clk"></span></div>'}
function tick(){const c=$('#clk');if(c)c.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function deco(){document.querySelectorAll('.md').forEach(w=>w.insertAdjacentHTML('afterbegin','<button type="button" class="back" data-act="close">\u2190 Back</button>'))}
document.addEventListener('pointerdown',ev=>{const tb=ev.target.closest&&ev.target.closest('.tb');if(!tb||ev.target.closest('[data-act]')||innerWidth<821)return;const w=tb.parentElement,k=w.classList.contains('win')?'main':w.classList.contains('md')?'md':'ac',s=wp[k]||(wp[k]={x:0,y:0}),sx=ev.clientX-s.x,sy=ev.clientY-s.y;
 const mv=e=>{s.x=e.clientX-sx;s.y=e.clientY-sy;w.style.transform=`translate(${s.x}px,${s.y}px)`},up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};addEventListener('pointermove',mv);addEventListener('pointerup',up);ev.preventDefault()});
setInterval(tick,30000);
async function login(e,p){const u=db.users.find(x=>x.email.toLowerCase()===e.toLowerCase().trim());if(!u||u.pw!==await hash(p)){aerr='Email or password is incorrect.';render();return}
 me=u;aerr='';try{localStorage.setItem(SK,u.id)}catch(x){}const ps=myProjects();pid=ps[0]?ps[0].id:null;view='board';render();toast('Welcome back, '+u.name.split(' ')[0])}
document.addEventListener('submit',async ev=>{const f=ev.target.dataset.form;if(!f)return;ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target)),p=me&&cur();
 if(f==='auth'){if(mode==='login')return login(d.email,d.pw);
  if(db.users.some(u=>u.email.toLowerCase()===d.email.toLowerCase().trim())){aerr='That email is already registered.';return render()}
  const u={id:uid(),name:d.name.trim(),email:d.email.trim(),pw:await hash(d.pw),role:d.role};db.users.push(u);save();return login(u.email,d.pw)}
 if(f==='proj'){const k=d.key.toUpperCase().replace(/[^A-Z]/g,'');if(k.length<2)return toast('Key needs at least 2 letters');if(db.projects.some(x=>x.key===k))return toast('That key is already used');
  const np={id:uid(),key:k,name:d.name.trim(),desc:d.desc,owner:me.id,members:[me.id],seq:1};db.projects.push(np);save();pid=np.id;modal=null;render();return toast('Project created')}
 if(f==='addm'){if(!d.u)return;p.members.push(d.u);save();render();return toast('Member added')}
 if(f==='cmt'){const i=db.issues.find(x=>x.id===modal.id);i.cm.push({by:me.id,tx:d.tx.trim(),at:Date.now()});save();render();return toast('Comment posted')}
 if(f==='issue'){const o={title:d.title.trim(),desc:d.desc,type:d.type,pr:d.pr,st:d.st,as:d.as||null};const sp=$('#shotprev img');o.shot=sp?sp.src:'';
  if(modal.id){Object.assign(db.issues.find(x=>x.id===modal.id),o);toast('Changes saved')}else{db.issues.push({id:uid(),pid:p.id,num:p.seq++,rep:me.id,cm:[],at:Date.now(),...o});toast('Issue created')}
  save();modal=null;render()}});
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,id=t.dataset.id,p=me&&cur();
 if(a==='open'&&ev.target.closest('.mv'))return;
 if(a==='mode'){mode=t.dataset.v;aerr='';render()}
 else if(a==='demo')login(t.dataset.e,t.dataset.p);
 else if(a==='gsearch'){filt.q=$('#gq').value;view='list';modal=null;render()}
 else if(a==='minmain'){minm=true;render()}
 else if(a==='restore'){minm=false;render()}
 else if(a==='maxmain'){maxm=!maxm;render()}
 else if(a==='logout'){me=null;modal=null;minm=false;try{localStorage.removeItem(SK)}catch(e){}render()}
 else if(a==='nav'){view=t.dataset.v;modal=null;render()}
 else if(a==='proj'){pid=id;filt={q:'',st:'',pr:'',as:''};render()}
 else if(a==='newproj')openModal({t:'proj'});
 else if(a==='newissue')openModal({t:'issue'});
 else if(a==='open')openModal({t:'issue',id});
 else if(a==='close'){modal=null;render()}
 else if(a==='mv'){const i=db.issues.find(x=>x.id===id);if(!canEd(i,p))return toast('You can only move your own or assigned issues');const k=ST.map(s=>s[0]),n=k.indexOf(i.st)+ +t.dataset.d;if(n<0||n>2)return;i.st=k[n];save();render()}
 else if(a==='rmm'){p.members=p.members.filter(m=>m!==id);db.issues.forEach(i=>{if(i.pid===p.id&&i.as===id)i.as=null});save();render();toast('Member removed')}
 else if(a==='delissue'){if(!modal.dc){modal.dc=1;return render()}db.issues=db.issues.filter(x=>x.id!==modal.id);save();modal=null;render();toast('Issue deleted')}
 else if(a==='delproj'){if(!modal||!modal.dp){modal={dp:1,t:'none'};render();return}db.issues=db.issues.filter(x=>x.pid!==p.id);db.projects=db.projects.filter(x=>x.id!==p.id);save();modal=null;const ps=myProjects();pid=ps[0]?ps[0].id:null;view='board';render();toast('Project deleted')}});
document.addEventListener('input',ev=>{if(ev.target.id==='gq')filt.q=ev.target.value;if(ev.target.id==='fq'){filt.q=ev.target.value;$('#res').innerHTML=res(cur())}});
document.addEventListener('change',ev=>{const t=ev.target;
 if(t.id==='psel'){pid=t.value;modal=null;filt={q:'',st:'',pr:'',as:''};render();return}
 if(t.dataset.f){filt[t.dataset.f]=t.value;$('#res').innerHTML=res(cur())}
 if(t.id==='shotf'&&t.files[0]){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,720/im.width),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);$('#shotprev').innerHTML=`<img class="shot" src="${c.toDataURL('image/jpeg',.7)}" alt="Screenshot">`};im.src=r.result};r.readAsDataURL(t.files[0])}});
document.addEventListener('dragstart',ev=>{const t=ev.target.closest&&ev.target.closest('.tk');if(t){dragId=t.dataset.id;ev.dataTransfer.setData('text/plain',dragId)}});
document.addEventListener('dragover',ev=>{const c=ev.target.closest&&ev.target.closest('.col');if(c&&dragId){ev.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x!==c&&x.classList.remove('over'));c.classList.add('over')}});
document.addEventListener('drop',ev=>{const c=ev.target.closest&&ev.target.closest('.col');if(!c||!dragId)return;ev.preventDefault();const i=db.issues.find(x=>x.id===dragId);dragId=null;
 if(!canEd(i,cur()))return render(),toast('You can only move your own or assigned issues');i.st=c.dataset.col;save();render();toast('Moved to '+ST.find(s=>s[0]===i.st)[1])});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'))});
document.addEventListener('click',ev=>{if(ev.target.classList&&ev.target.classList.contains('ov')){modal=null;render()}});
document.addEventListener('keydown',ev=>{if(ev.target.id==='gq'&&ev.key==='Enter'){filt.q=ev.target.value;view='list';modal=null;render()}});
load();
</script>
</body>
</html>
